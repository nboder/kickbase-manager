name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neue Version (z. B. 1.2.3). Aktuelle Version siehe Job-Log "Show current version".'
        required: true

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show current version
        run: node -p "require('./package.json').version"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          CI: true
        run: npx nx release version ${{ inputs.version }} --git-commit --git-tag

      - name: Build for GitHub Pages
        run: npm run deploy-build

      - name: Flatten build output and add explicit 404 page
        run: |
          if [ -d ./docs/browser ]; then
            mv ./docs/browser/* ./docs/
            rm -rf ./docs/browser/
          fi
          cp ./docs/index.html ./docs/404.html

      - name: Commit and push updated docs
        run: |
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            git push --follow-tags
          else
            git commit -m "chore: deploy GitHub Pages [skip ci]"
            git push --follow-tags
          fi
